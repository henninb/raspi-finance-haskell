name: raspi-finance-haskell
version: 0.1.0.0
author: Brian Henning

executables:
  raspi-finance-database:
    main: raspi-finance-database.hs
    source-dirs: src
    ghc-options:
      - -Wall
    dependencies:
      - base >= 4.7 && < 5
      - aeson
      - postgresql-simple
      - bytestring
      - time
      - directory
